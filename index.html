<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestione Turni Gattile</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f7f7f8;
            color: #333;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            padding: 20px;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
        }
        h1 {
            font-size: 1.5rem;
            margin-bottom: 10px;
        }
        p {
            color: #666;
            font-size: 0.95rem;
            margin-bottom: 25px;
        }
        .btn {
            background-color: #ff4b4b;
            color: white;
            padding: 12px 24px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: bold;
            font-size: 1rem;
            display: inline-block;
            box-shadow: 0 4px 10px rgba(255, 75, 75, 0.3);
        }
        .btn:active {
            transform: scale(0.98);
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🐱 Gattile</h1>
        <p>Sistema di gestione turni, box e Volontari.</p>
        <a href="https://turni-gattile.streamlit.app/" class="btn">🚀 Entra nell'Applicazione</a>
    </div>
</body>
</html>
